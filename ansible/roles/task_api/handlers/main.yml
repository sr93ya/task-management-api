---
- name: Restart task-api
  ansible.builtin.command:
    cmd: supervisorctl reread
  changed_when: true
  notify: Apply Supervisor configuration

- name: Apply Supervisor configuration
  ansible.builtin.command:
    cmd: supervisorctl update
  changed_when: true
  notify: Restart application

- name: Restart application
  ansible.builtin.command:
    cmd: supervisorctl restart task-api
  changed_when: true
