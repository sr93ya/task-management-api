---
- name: Update apt package cache
  ansible.builtin.apt:
    update_cache: yes

- name: Install Java 17 runtime and Supervisor
  ansible.builtin.apt:
    name:
      - openjdk-17-jre-headless
      - supervisor
    state: present

- name: Create application directory
  ansible.builtin.file:
    path: /opt/task-api
    state: directory
    mode: '0755'

- name: Copy application JAR
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../target/task-api-0.0.1-SNAPSHOT.jar"
    dest: /opt/task-api/task-api.jar
    mode: '0644'
  notify: Restart task-api

- name: Configure application service
  ansible.builtin.template:
    src: task-api.conf.j2
    dest: /etc/supervisor/conf.d/task-api.conf
    mode: '0644'
  notify: Restart task-api

- name: Ensure Supervisor is running
  ansible.builtin.service:
    name: supervisor
    state: started
    enabled: yes
